version: "3.9"

services:

  # ── MySQL ────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: stripe-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: 12345qwert
      MYSQL_DATABASE: stripe_db
    ports:
      - "3307:3306"       # Yerel MySQL ile çakışmaması için 3307
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p12345qwert"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── MongoDB ───────────────────────────────────────────────
  mongo:
    image: mongo:7.0
    container_name: stripe-mongo
    restart: unless-stopped
    ports:
      - "27018:27017"     # Yerel MongoDB ile çakışmaması için 27018
    volumes:
      - mongo_data:/data/db

  # ── Flask REST API ────────────────────────────────────────
  flask-api:
    build: .
    container_name: stripe-api
    restart: unless-stopped
    ports:
      - "5001:5000"       # Yerel 5000 portunuzdaki Flask ile çakışmaması için 5001
    env_file:
      - .env.docker
    depends_on:
      mysql:
        condition: service_healthy
      mongo:
        condition: service_started
      redis:
        condition: service_started
    volumes:
      - ./data:/app/data  # PDF ve CSV dosyaları kalıcı
      - ./logs:/app/logs
      
  # ── RabbitMQ ───────────────────────────────────────────────
  rabbitmq:
    image: rabbitmq:3-management
    container_name: stripe-rabbitmq
    restart: unless-stopped
    ports:
      - "5672:5672"
      - "15672:15672" # Management UI

  # ── Celery Worker ───────────────────────────────────────────
  celery-worker:
    build: .
    container_name: stripe-celery
    restart: unless-stopped
    command: celery -A core.celery_app.celery worker --loglevel=info
    env_file:
      - .env.docker
    depends_on:
      - rabbitmq
      - mysql
      - mongo
      - redis
    volumes:
      - ./data:/app/data
      - ./logs:/app/logs

  # ── Redis (Cache & State) ──────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: stripe-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes

volumes:
  mysql_data:
  mongo_data:
  redis_data:
