<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test Modu — Müşteri Listesi</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --accent-hover: #2563eb;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --border-color: #334155;
            --badge-bg: #0369a1;
            --badge-text: #e0f2fe;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 2rem;
        }

        .container {
            width: 100%;
            max-width: 1000px;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1.5rem;
            background: var(--card-bg);
            padding: 1.5rem 2rem;
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .header-title {
            display: flex;
            align-items: center;
            gap: 0.75rem;
        }

        .header-title h1 {
            font-size: 1.5rem;
            font-weight: 700;
        }

        .badge-test {
            background-color: #ef4444;
            color: #ffffff;
            font-size: 0.75rem;
            font-weight: 600;
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .btn-refresh {
            background-color: var(--accent-color);
            color: white;
            border: none;
            padding: 0.6rem 1.2rem;
            border-radius: 0.5rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.5rem;
            transition: all 0.2s ease;
        }

        .btn-refresh:hover {
            background-color: var(--accent-hover);
            transform: translateY(-1px);
        }

        /* Mode Selector Navigation Tabs */
        .mode-tabs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 1rem;
            margin-bottom: 1.5rem;
        }

        .tab-btn {
            background: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 0.75rem;
            padding: 1rem;
            color: var(--text-secondary);
            cursor: pointer;
            text-align: left;
            transition: all 0.2s ease;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .tab-btn:hover {
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .tab-btn.active {
            background: rgba(59, 130, 246, 0.1);
            border-color: var(--accent-color);
            color: var(--text-primary);
        }

        .tab-btn .tab-title {
            font-weight: 700;
            font-size: 1rem;
            margin-bottom: 0.3rem;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .tab-btn.active .tab-title {
            color: #60a5fa;
        }

        .tab-btn .tab-meta {
            font-size: 0.8rem;
            color: var(--text-secondary);
        }

        .card {
            background: var(--card-bg);
            border-radius: 1rem;
            border: 1px solid var(--border-color);
            overflow: hidden;
            box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.3);
        }

        .table-responsive {
            width: 100%;
            overflow-x: auto;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            text-align: left;
        }

        th {
            background-color: rgba(15, 23, 42, 0.6);
            color: var(--text-secondary);
            font-size: 0.85rem;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.05em;
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
        }

        td {
            padding: 1rem 1.5rem;
            border-bottom: 1px solid var(--border-color);
            color: var(--text-primary);
            font-size: 0.95rem;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(255, 255, 255, 0.02);
        }

        .stripe-id {
            font-family: monospace;
            background: rgba(59, 130, 246, 0.1);
            color: #60a5fa;
            padding: 0.2rem 0.5rem;
            border-radius: 0.25rem;
            font-size: 0.85rem;
        }

        .loading-state, .empty-state {
            text-align: center;
            padding: 3rem 1.5rem;
            color: var(--text-secondary);
        }

        .loading-state i {
            font-size: 2rem;
            margin-bottom: 1rem;
            color: var(--accent-color);
        }

        /* Pagination Bar Styles */
        .pagination-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 1rem 1.5rem;
            background-color: rgba(15, 23, 42, 0.6);
            border-top: 1px solid var(--border-color);
        }

        .page-info {
            color: var(--text-secondary);
            font-size: 0.9rem;
            font-weight: 500;
        }

        .pagination-buttons {
            display: flex;
            gap: 0.5rem;
        }

        .btn-page {
            background-color: #334155;
            color: var(--text-primary);
            border: 1px solid var(--border-color);
            padding: 0.5rem 1rem;
            border-radius: 0.375rem;
            font-size: 0.875rem;
            font-weight: 500;
            cursor: pointer;
            display: flex;
            align-items: center;
            gap: 0.4rem;
            transition: all 0.2s ease;
        }

        .btn-page:hover:not(:disabled) {
            background-color: var(--accent-color);
            border-color: var(--accent-color);
        }

        .btn-page:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <div class="header">
            <div class="header-title">
                <i class="fa-solid fa-flask-vial fa-lg" style="color: #ef4444;"></i>
                <h1>Müşteri Listesi</h1>
                <span class="badge-test" id="mode-badge">Test Modu 1</span>
            </div>
            <button class="btn-refresh" onclick="resetAndFetch()">
                <i class="fa-solid fa-arrows-rotate"></i> Yenile
            </button>
        </div>

        <!-- 3 Test Modu Seçim Sekmeleri -->
        <div class="mode-tabs">
            <button class="tab-btn active" id="tab-mode-1" onclick="switchMode(1)">
                <div class="tab-title">
                    <span>Test Modu 1</span>
                    <i class="fa-solid fa-gauge"></i>
                </div>
                <div class="tab-meta">İstek Limiti: <strong>5</strong> | Sayfalama: <strong>10-10</strong></div>
            </button>

            <button class="tab-btn" id="tab-mode-2" onclick="switchMode(2)">
                <div class="tab-title">
                    <span>Test Modu 2</span>
                    <i class="fa-solid fa-gauge-high"></i>
                </div>
                <div class="tab-meta">İstek Limiti: <strong>10</strong> | Sayfalama: <strong>10-10</strong></div>
            </button>

            <button class="tab-btn" id="tab-mode-3" onclick="switchMode(3)">
                <div class="tab-title">
                    <span>Test Modu 3</span>
                    <i class="fa-solid fa-bolt"></i>
                </div>
                <div class="tab-meta">İstek Limiti: <strong>25</strong> | Sayfalama: <strong>10-10</strong></div>
            </button>
        </div>

        <!-- Müşteri Listesi Kartı -->
        <div class="card">
            <div class="table-responsive">
                <table>
                    <thead>
                        <tr>
                            <th>#</th>
                            <th>Stripe ID</th>
                            <th>Müşteri Adı</th>
                            <th>E-Posta</th>
                            <th>Oluşturulma Tarihi</th>
                        </tr>
                    </thead>
                    <tbody id="customers-tbody">
                        <tr>
                            <td colspan="5" class="loading-state">
                                <i class="fa-solid fa-circle-notch fa-spin"></i>
                                <p>Müşteriler yükleniyor...</p>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- 10'ar 10'ar Sayfalama Barı -->
            <div class="pagination-bar">
                <span id="page-info" class="page-info">Sayfa 1 (10-10 Görünüm)</span>
                <div class="pagination-buttons">
                    <button id="btn-prev" class="btn-page" onclick="prevPage()" disabled>
                        <i class="fa-solid fa-chevron-left"></i> Önceki
                    </button>
                    <button id="btn-next" class="btn-page" onclick="nextPage()" disabled>
                        Sonraki <i class="fa-solid fa-chevron-right"></i>
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script>
        const MODE_LIMITS = { 1: 5, 2: 10, 3: 25 };
        const UI_PAGE_SIZE = 10;

        let activeMode = {{ mode_id|default(1) }};
        let currentPage = 1;
        
        // Mode-specific state storage
        let loadedItems = [];
        let cursorHistory = [null];
        let hasMoreAPI = false;

        function updateTabUI() {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            const activeTab = document.getElementById(`tab-mode-${activeMode}`);
            if (activeTab) activeTab.classList.add('active');
            
            const modeBadge = document.getElementById('mode-badge');
            if (modeBadge) modeBadge.textContent = `Test Modu ${activeMode} (Limit: ${MODE_LIMITS[activeMode]})`;
        }

        function switchMode(modeId) {
            if (MODE_LIMITS[modeId]) {
                activeMode = modeId;
                updateTabUI();
                resetAndFetch();
            }
        }

        async function fetchTestCustomers() {
            const tbody = document.getElementById('customers-tbody');
            const btnPrev = document.getElementById('btn-prev');
            const btnNext = document.getElementById('btn-next');
            const pageInfo = document.getElementById('page-info');

            btnPrev.disabled = true;
            btnNext.disabled = true;

            const apiLimit = MODE_LIMITS[activeMode];

            tbody.innerHTML = `
                <tr>
                    <td colspan="5" class="loading-state">
                        <i class="fa-solid fa-circle-notch fa-spin"></i>
                        <p>Test Modu ${activeMode} (İstek Limiti: ${apiLimit}) — Yükleniyor...</p>
                    </td>
                </tr>
            `;

            try {
                // UI sayfa 10-10 görüntüler. Gereken kayıt sayısına ulaşılana kadar API istek limitine göre çekim yapılır.
                const neededCount = currentPage * UI_PAGE_SIZE;
                
                while (loadedItems.length < neededCount) {
                    const lastItem = loadedItems.length > 0 ? loadedItems[loadedItems.length - 1] : null;
                    const cursor = lastItem ? lastItem.id : null;
                    
                    let url = `/api/customers?limit=${apiLimit}`;
                    if (cursor) url += `&starting_after=${cursor}`;

                    const res = await fetch(url);
                    if (!res.ok) throw new Error('Müşteri listesi çekilemedi.');
                    const result = await res.json();
                    
                    const newItems = result.data || [];
                    hasMoreAPI = result.has_more || false;
                    
                    if (newItems.length === 0) break;
                    
                    loadedItems.push(...newItems);
                    if (!hasMoreAPI) break;
                }

                // UI sayfalama dilimini kes (10-10)
                const startIndex = (currentPage - 1) * UI_PAGE_SIZE;
                const pageItems = loadedItems.slice(startIndex, startIndex + UI_PAGE_SIZE);

                if (pageItems.length === 0) {
                    tbody.innerHTML = `
                        <tr>
                            <td colspan="5" class="empty-state">
                                <p>Henüz gösterilecek müşteri bulunmuyor.</p>
                            </td>
                        </tr>
                    `;
                    pageInfo.textContent = `Sayfa ${currentPage} (Test Modu ${activeMode})`;
                    btnPrev.disabled = currentPage === 1;
                    btnNext.disabled = true;
                    return;
                }

                // Tabloyu render et
                tbody.innerHTML = pageItems.map((cust, index) => {
                    const dateStr = cust.created 
                        ? new Date(cust.created * 1000).toLocaleString('tr-TR')
                        : '-';
                    return `
                        <tr>
                            <td>${startIndex + index + 1}</td>
                            <td><span class="stripe-id">${cust.id}</span></td>
                            <td><strong>${cust.name || 'Bilinmiyor'}</strong></td>
                            <td>${cust.email || '-'}</td>
                            <td>${dateStr}</td>
                        </tr>
                    `;
                }).join('');

                const hasNextPage = (loadedItems.length > startIndex + UI_PAGE_SIZE) || hasMoreAPI;

                pageInfo.textContent = `Sayfa ${currentPage} (${pageItems.length} Kayıt / 10-10 Görünüm | İstek Limiti: ${apiLimit})`;
                btnPrev.disabled = currentPage === 1;
                btnNext.disabled = !hasNextPage;

            } catch (err) {
                tbody.innerHTML = `
                    <tr>
                        <td colspan="5" class="empty-state" style="color: #f87171;">
                            <p>⚠️ Hata: ${err.message}</p>
                        </td>
                    </tr>
                `;
                pageInfo.textContent = `Sayfa ${currentPage}`;
                btnPrev.disabled = currentPage === 1;
                btnNext.disabled = true;
            }
        }

        function nextPage() {
            currentPage++;
            fetchTestCustomers();
        }

        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                fetchTestCustomers();
            }
        }

        function resetAndFetch() {
            currentPage = 1;
            loadedItems = [];
            hasMoreAPI = false;
            fetchTestCustomers();
        }

        document.addEventListener('DOMContentLoaded', () => {
            updateTabUI();
            fetchTestCustomers();
        });
    </script>
</body>
</html>
